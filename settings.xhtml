<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN"><head><meta charset="utf-8"/><title>随读笔记设置</title><style>body{font:14px "Microsoft YaHei",sans-serif;margin:22px;color:#222;background:#fff;color-scheme:light}h3{margin-top:0}.row{display:grid;grid-template-columns:1fr 185px;gap:14px;align-items:center;margin:12px 0}.row>label{display:block}button,input{font:inherit;box-sizing:border-box;color:#202124}button{padding:7px 10px;background:#f2f5f9;border:1px solid #8995a4;border-radius:4px;cursor:pointer}input[type=text]{display:block;width:100%;padding:7px 10px;background:#f5f7fa;border:1px solid #8995a4;border-radius:4px}button:focus-visible,input:focus{outline:2px solid #2368c4;outline-offset:2px}.font-picker{position:relative}.font-picker>button{width:100%;text-align:left}.font-options{position:absolute;top:100%;left:0;right:0;z-index:10;margin-top:3px;background:#fff;border:1px solid #718096;box-shadow:0 4px 12px #0003;padding:3px}.font-options[hidden]{display:none}.font-options button{display:block;width:100%;text-align:left;border:0;background:#fff;color:#202124;border-radius:0}.font-options button:hover,.font-options button:focus{background:#dceaff}small{display:block;color:#555;margin-top:4px}#preview{padding:12px;border:1px solid #ccc;margin-top:16px}#error{color:#b42318;min-height:20px}.actions{display:flex;gap:8px;margin-top:14px}input[type=checkbox]{width:18px;height:18px}</style></head><body><h3>字体与段落</h3><div class="row"><label for="ownFont">自己文字的字体</label><div class="font-picker"><button type="button" id="ownFont" aria-haspopup="listbox" aria-expanded="false" aria-controls="ownFontOptions"></button><div class="font-options" id="ownFontOptions" role="listbox" aria-label="自己文字的字体" hidden="hidden"></div></div></div><div class="row"><label for="excerptFont">原文摘录的字体</label><div class="font-picker"><button type="button" id="excerptFont" aria-haspopup="listbox" aria-expanded="false" aria-controls="excerptFontOptions"></button><div class="font-options" id="excerptFontOptions" role="listbox" aria-label="原文摘录的字体" hidden="hidden"></div></div></div><div class="row"><label for="fontSize">字号（像素）</label><div><input id="fontSize" type="text" inputmode="decimal" data-numeric="true" data-min="10" data-max="28"/><small>10–28</small></div></div><div class="row"><label for="lineHeight">行间距（倍数）</label><div><input id="lineHeight" type="text" inputmode="decimal" data-numeric="true" data-min="1" data-max="2.5"/><small>1–2.5</small></div></div><div class="row"><label for="paragraphBefore">段前间距（像素）</label><div><input id="paragraphBefore" type="text" inputmode="decimal" data-numeric="true" data-min="0" data-max="24"/><small>0–24</small></div></div><div class="row"><label for="paragraphAfter">段后间距（像素）</label><div><input id="paragraphAfter" type="text" inputmode="decimal" data-numeric="true" data-min="0" data-max="24"/><small>0–24</small></div></div><div class="row"><label for="italic">摘录使用斜体</label><input id="italic" type="checkbox"/></div><div class="row"><label for="bold">摘录使用加粗</label><input id="bold" type="checkbox"/></div><small>作用于随读笔记显示和 Word 导出。</small><div id="preview"><p id="quotePreview">这是一段原文摘录。Original excerpt.</p><p>这是自己的想法。My own notes.</p></div><p id="error" role="alert"></p><div class="actions"><button id="save">保存</button><button id="reset">恢复默认</button><button id="cancel">取消</button></div></body></html>
